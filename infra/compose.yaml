services:
  postgres:
    image: postgres:18.4
    container_name: repomind-postgres

    environment:
      POSTGRES_DB: repomind
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - repomind_postgres_data:/var/lib/postgresql

volumes:
  repomind_postgres_data: